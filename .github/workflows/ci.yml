name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Unit Tests (Cold Isolation)
        run: bun test

      - name: Run Full Pipeline End-to-End
        run: |
          bun run seed
          bun run detect
          bun run diagnose
          bun run policy
          bun run gate
          bun run execute
          bun run verify
          bun run measure
          bun run ablate

      - name: Verify Audit Hash Chain Integrity
        run: bun run engines/audit.ts --verify
